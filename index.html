<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VOOB CORE</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{display:grid;place-items:center;background:#0b0b0d;color:#e9e9ee;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{text-align:center;padding:24px}
  .rings{display:flex;justify-content:center;margin-bottom:28px}
  .rings i{width:44px;height:44px;border-radius:50%;border:4px solid #fff}
  .rings i+i{margin-left:-14px;border:0;padding:4px;
    background:linear-gradient(135deg,#b69cff,#4fe3d0);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude}
  h1{font-weight:300;letter-spacing:.42em;font-size:20px;padding-left:.42em}
  p{margin-top:14px;font-size:13px;color:#8b8b96;letter-spacing:.04em}
</style>
</head>
<body>
<main>
  <div class="rings"><i></i><i></i></div>
  <h1>VOOB CORE</h1>
  <p>Скоро здесь появится вход</p>
</main>
</body>
</html>
